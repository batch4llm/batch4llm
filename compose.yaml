name: batch4llm

services:
  migrate:
    image: ghcr.io/batch4llm/backend:${BATCH4LLM_VERSION:-latest}
    command: sh -c "b4llm db upgrade && b4llm user ensure-admin"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  traefik:
    image: traefik:v3.6
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      # HTTPS is enabled via compose.prod.yaml (see README)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    depends_on:
      - backend
      - frontend

  backend:
    image: ghcr.io/batch4llm/backend:${BATCH4LLM_VERSION:-latest}
    command: uvicorn batch4llm.app:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    env_file: .env
    environment:
      MINIO_PUBLIC_URL: http://localhost/storage
      AUTH_REQUIRED: "true"
      SECURE_COOKIES: "true"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/docs`) || Path(`/redoc`) || Path(`/openapi.json`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.priority=10"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  frontend:
    image: ghcr.io/batch4llm/frontend:${BATCH4LLM_VERSION:-latest}
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    depends_on:
      - backend

  worker:
    image: ghcr.io/batch4llm/backend:${BATCH4LLM_VERSION:-latest}
    command: celery -A batch4llm.celery.worker worker --loglevel=info
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    image: ghcr.io/batch4llm/backend:${BATCH4LLM_VERSION:-latest}
    command: celery -A batch4llm.celery.worker beat --loglevel=info
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  db:
    image: postgres:18
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    env_file: .env
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=PathPrefix(`/storage`)"
      - "traefik.http.routers.minio.entrypoints=web"
      - "traefik.http.routers.minio.middlewares=minio-strip"
      - "traefik.http.routers.minio.priority=10"
      - "traefik.http.middlewares.minio-strip.stripprefix.prefixes=/storage"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
