[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "batch4llm"
version = "0.1.0"
description = "Automated evaluation of files via various AI APIs"
authors = [{ name = "Ben Kathöfer", email = "benjino@posteo.de" }]
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
batch4llm = "batch4llm.cli:app"
b4llm = "batch4llm.cli:app"
b4 = "batch4llm.cli:app"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "httpx==0.28.1",
    "black==26.5.1",
    "ruff==0.16.8",
    "pre-commit==4.6.2",
    "celery-types==0.26.0",
    "python-dotenv==1.2.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "real_api: hits real LLM provider APIs, costs money, skipped when the required API key is not set",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
